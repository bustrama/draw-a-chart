# Self-hosted draw-a-chart: the app and its sync server on one port.
#   docker compose up -d --build
# Then open http://<server>:8080 on every device (or your Cloudflare Tunnel hostname).
services:
  draw-a-chart:
    build: .
    image: draw-a-chart:latest
    container_name: draw-a-chart
    restart: unless-stopped
    ports:
      # LAN access (no sign-in: anyone on the network can use it, bypassing Cloudflare Access).
      # Behind the tunnel only? Use "127.0.0.1:8080:8080", or drop the mapping when cloudflared
      # runs in this compose network and targets http://draw-a-chart:8080. Never publish on a VPS.
      - "8080:8080"
    volumes:
      # The SQLite databases: draw-a-chart.sqlite (drawings: back it up, see README "Self-hosting")
      # and market.sqlite (the bar cache: it refills, except futures history older than Yahoo's).
      - draw-a-chart-data:/data
    environment:
      # US stocks (Alpaca; a free paper-account key works). Put both in a .env file next to this
      # one (never commit it); without them the app has no US stocks.
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      # delayed_sip (default, free: every exchange, 15 min late), sip (real time, paid), iex.
      ALPACA_FEED: ${ALPACA_FEED:-delayed_sip}
      # Futures come from Yahoo Finance (no key, unofficial); FUTURES_DATA=off in .env turns them off.
      FUTURES_DATA: ${FUTURES_DATA:-}
      # REQUEST_LOG=1 in .env: one log line per request (debugging a login proxy such as Access).
      REQUEST_LOG: ${REQUEST_LOG:-}
    #   MAX_ROWS: "100000"          # live drawings per user (a guard against runaway clients)
    #   ALLOWED_ORIGINS: ""         # only if a proxy rewrites the Host header (live connection)

  # Optional: a Cloudflare Tunnel in the same compose project. Create the tunnel in Zero Trust
  # (Networks > Tunnels), point its public hostname at http://draw-a-chart:8080, and put the
  # token in a .env file next to this one (never commit it): CLOUDFLARE_TUNNEL_TOKEN=...
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - draw-a-chart

volumes:
  draw-a-chart-data:
