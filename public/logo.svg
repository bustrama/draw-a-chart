  </g>
  <rect x="120" y="188" width="64" height="102" rx="12" fill="#ef5350"/>
  <rect x="218" y="142" width="64" height="108" rx="12" fill="#26a69a"/>
  <rect x="316" y="196" width="64" height="104" rx="12" fill="#26a69a"/>
